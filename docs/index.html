<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Akila Nilupul · Contribution Graph</title>
<meta name="description" content="Interactive GitHub contribution graph for akila-ncmd — hover any day to see its exact contribution count." />
<style>
  :root{
    --bg:#0A0A0A; --accent:#FF0000; --fg:#ffffff;
    --muted:rgba(255,255,255,.45); --grid:rgba(255,0,0,.18);
    --card:#0f0f0f; --edge:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:400 15px/1.5 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 56px}
  h1{font-size:clamp(1.3rem,3.4vw,2rem);color:var(--accent);margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.86rem;margin:0 0 26px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
  .stat{background:var(--card);border:1px solid var(--edge);border-radius:12px;
    padding:11px 16px;min-width:120px}
  .stat b{display:block;color:var(--accent);font-size:1.32rem;line-height:1.2}
  .stat span{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.14em}
  .ranges{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .ranges button{background:var(--card);color:var(--muted);border:1px solid var(--edge);
    border-radius:999px;padding:7px 15px;font:inherit;font-size:.78rem;cursor:pointer;
    transition:all .18s}
  .ranges button:hover{color:var(--fg);border-color:rgba(255,0,0,.45)}
  .ranges button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chart{position:relative;background:var(--card);border:1px solid var(--edge);
    border-radius:16px;padding:8px;overflow:hidden}
  svg{display:block;width:100%;height:auto;touch-action:none}
  .hit{fill:transparent}
  #tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
    background:#000;border:1px solid var(--accent);border-radius:10px;padding:8px 12px;
    font-size:.8rem;white-space:nowrap;z-index:5;
    box-shadow:0 10px 30px rgba(0,0,0,.65)}
  #tip b{color:var(--accent);font-size:1.05rem}
  #tip i{display:block;color:var(--muted);font-style:normal;font-size:.72rem;margin-top:2px}
  .empty{color:var(--muted);padding:40px 4px}
  footer{margin-top:26px;color:var(--muted);font-size:.76rem}
  footer a{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Contribution Graph</h1>
  <p class="sub">Hover or tap any point to see that day's exact contribution count.</p>

  <div class="stats" id="stats"></div>
  <div class="ranges" id="ranges"></div>

  <div class="chart" id="chart">
    <div class="empty" id="empty">Loading contribution data…</div>
    <div id="tip" role="status" aria-live="polite"></div>
  </div>

  <footer>
    Data regenerated daily by
    <a href="https://github.com/akila-ncmd/akila-ncmd/blob/main/.github/workflows/profile-metrics.yml">profile-metrics</a>.
    <span id="gen"></span>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var W = 1180, H = 430, L = 62, R = 26, T = 26, B = 46;
  var NS = "http://www.w3.org/2000/svg";
  var chart = document.getElementById("chart");
  var tip = document.getElementById("tip");
  var empty = document.getElementById("empty");
  var all = [], view = [], pts = [], svg = null;

  function el(n, a) {
    var e = document.createElementNS(NS, n);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }
  function fmt(iso) {
    var p = iso.split("-"), m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[+p[1] - 1] + " " + (+p[2]) + ", " + p[0];
  }
  function ceilNice(v) {
    if (v <= 5) return 5;
    var steps = [5,10,25,50,100,250,500,1000];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i] * 7) return Math.ceil(v / steps[i]) * steps[i];
    return Math.ceil(v / 1000) * 1000;
  }

  function draw(days) {
    view = days;
    if (svg) svg.remove();
    if (!days.length) { empty.textContent = "No contribution data."; return; }
    empty.style.display = "none";

    var counts = days.map(function (d) { return d.c; });
    var top = ceilNice(Math.max.apply(null, counts));
    var pw = W - L - R, ph = H - T - B;
    var step = days.length > 1 ? pw / (days.length - 1) : 0;
    var xAt = function (i) { return L + i * step; };
    var yAt = function (c) { return T + ph - (c / top) * ph; };

    svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
      "aria-label": "Contribution graph, " + days.length + " days" });

    // gridlines + y ticks
    for (var r = 0; r <= 5; r++) {
      var val = Math.round(top * r / 5), gy = yAt(val);
      svg.appendChild(el("line", { x1: L, y1: gy, x2: W - R, y2: gy,
        stroke: "#FF0000", "stroke-opacity": .16, "stroke-dasharray": "3 4" }));
      var t = el("text", { x: L - 12, y: gy + 4, fill: "#FF0000",
        "font-size": 12, "font-weight": 700, "text-anchor": "end" });
      t.textContent = val;
      svg.appendChild(t);
    }

    pts = days.map(function (d, i) { return { x: xAt(i), y: yAt(d.c), d: d }; });
    var poly = pts.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    var base = T + ph;

    svg.appendChild(el("polygon", {
      points: L + "," + base + " " + poly + " " + (L + pw) + "," + base,
      fill: "#FF0000", "fill-opacity": .14 }));
    svg.appendChild(el("polyline", { points: poly, fill: "none", stroke: "#FF0000",
      "stroke-width": 3, "stroke-linejoin": "round", "stroke-linecap": "round" }));

    // x labels, thinned so they never collide
    var everyN = Math.ceil(days.length / 24);
    days.forEach(function (d, i) {
      if (i % everyN) return;
      var t = el("text", { x: xAt(i), y: base + 22, fill: "#FF0000", "font-size": 11,
        "font-weight": 700, "text-anchor": "middle" });
      t.textContent = d.d.slice(8, 10).replace(/^0/, "");
      svg.appendChild(t);
    });

    // marker + full-height guide, moved on hover
    var guide = el("line", { y1: T, y2: base, stroke: "#FF0000",
      "stroke-opacity": .5, "stroke-width": 1, opacity: 0 });
    var dot = el("circle", { r: 6, fill: "#fff", stroke: "#FF0000",
      "stroke-width": 3, opacity: 0 });
    svg.appendChild(guide);
    svg.appendChild(dot);

    // one transparent band per day => reliable hover, no pixel hunting
    days.forEach(function (d, i) {
      var half = step / 2 || pw;
      var band = el("rect", { class: "hit", x: Math.max(L, xAt(i) - half), y: T,
        width: Math.max(step, 6), height: ph });
      band.addEventListener("pointerenter", function () { show(i, guide, dot, base); });
      band.addEventListener("pointerdown", function () { show(i, guide, dot, base); });
      svg.appendChild(band);
    });

    svg.addEventListener("pointerleave", function () {
      tip.style.opacity = 0; guide.setAttribute("opacity", 0); dot.setAttribute("opacity", 0);
    });

    chart.appendChild(svg);
  }

  function show(i, guide, dot, base) {
    var p = pts[i];
    guide.setAttribute("x1", p.x); guide.setAttribute("x2", p.x); guide.setAttribute("opacity", 1);
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); dot.setAttribute("opacity", 1);

    tip.innerHTML = "<b>" + p.d.c + (p.d.c === 1 ? " contribution" : " contributions") +
      "</b><i>" + fmt(p.d.d) + "</i>";
    tip.style.opacity = 1;

    // px per viewBox unit, so the tip tracks the point at any width
    var rect = svg.getBoundingClientRect(), k = rect.width / W;
    var left = p.x * k, tw = tip.offsetWidth;
    left = Math.min(Math.max(left - tw / 2, 4), rect.width - tw - 4);
    tip.style.left = left + "px";
    tip.style.top = Math.max(p.y * k - tip.offsetHeight - 14, 4) + "px";
  }

  function stats(days) {
    var total = days.reduce(function (a, d) { return a + d.c; }, 0);
    var best = days.reduce(function (a, d) { return d.c > a.c ? d : a; }, days[0]);
    var active = days.filter(function (d) { return d.c > 0; }).length;
    var box = document.getElementById("stats");
    box.innerHTML = "";
    [[total, "contributions"], [best.c, "best day"],
     [active + "/" + days.length, "active days"],
     [(total / days.length).toFixed(1), "daily average"]
    ].forEach(function (s) {
      var d = document.createElement("div");
      d.className = "stat";
      d.innerHTML = "<b>" + s[0] + "</b><span>" + s[1] + "</span>";
      box.appendChild(d);
    });
  }

  function ranges() {
    var box = document.getElementById("ranges");
    box.innerHTML = "";
    [30, 90, 180, all.length].forEach(function (n, i, arr) {
      if (n > all.length) return;
      if (arr.indexOf(n) !== i) return;
      var b = document.createElement("button");
      b.textContent = n === all.length ? "All " + n + "d" : "Last " + n + "d";
      b.setAttribute("aria-pressed", n === 30);
      b.addEventListener("click", function () {
        [].forEach.call(box.children, function (c) { c.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        var slice = all.slice(-n);
        draw(slice); stats(slice);
      });
      box.appendChild(b);
    });
  }

  fetch("./contributions.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      all = data.days || [];
      if (!all.length) throw new Error("no days in payload");
      document.title = data.label + " · Contribution Graph";
      document.querySelector("h1").textContent = data.label + "'s Contribution Graph";
      document.getElementById("gen").textContent = "Last updated " + data.generated + ".";
      var start = all.slice(-30);
      draw(start); stats(start); ranges();
      window.addEventListener("resize", function () { tip.style.opacity = 0; });
    })
    .catch(function (err) {
      empty.textContent = "Could not load contribution data (" + err.message + ").";
    });
})();
</script>
</body>
</html>
